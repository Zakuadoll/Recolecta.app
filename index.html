<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recolecta App - Tu Aliado en el Reciclaje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/phosphor-icons"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .view {
            display: none;
        }
        .view.active {
            display: block;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bg-gradient-green {
            background: linear-gradient(135deg, #66BB6A 0%, #388E3C 100%);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div id="app-container" class="max-w-md mx-auto bg-white shadow-lg rounded-b-lg min-h-screen">

        <!-- Login View -->
        <div id="login-view" class="view active flex flex-col items-center justify-center h-screen p-8 bg-gradient-green">
            <div class="text-center text-white">
                <i class="ph-recycle text-7xl"></i>
                <h1 class="text-4xl font-bold mt-4">Recolecta App</h1>
                <p class="mt-2 text-green-100">Incentivando un planeta más verde, un hogar a la vez.</p>
            </div>
            <div class="w-full mt-12 bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-semibold text-center text-gray-700 mb-6">Iniciar Sesión</h2>
                <input type="email" placeholder="Correo electrónico" class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" value="usuario@email.com">
                <input type="password" placeholder="Contraseña" class="w-full px-4 py-2 mb-6 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" value="********">
                <button onclick="login()" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition duration-300 font-semibold">Ingresar</button>
            </div>
        </div>

        <!-- Main App View -->
        <div id="main-app" class="view">
            <!-- Header -->
            <header class="bg-gradient-green text-white p-4 rounded-b-lg shadow-md sticky top-0 z-10">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-sm text-green-100">Bienvenido,</p>
                        <h1 class="text-xl font-bold">Carlos Rodríguez</h1>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-green-100">Mis Puntos</p>
                        <p class="text-xl font-bold flex items-center"><i class="ph-star-fill text-yellow-300 mr-1"></i> 1,250</p>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main id="main-content" class="p-4 pb-20">
                <!-- Dashboard View -->
                <div id="dashboard-view" class="view active fade-in">
                    <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded-lg mb-6">
                        <p class="font-semibold">¡Gracias por tu compromiso!</p>
                        <p class="text-sm">Has reciclado <span class="font-bold">15.2 kg</span> este mes.</p>
                    </div>

                    <div class="text-center mb-6">
                        <button onclick="showView('request-view')" class="bg-green-600 text-white font-bold py-4 px-8 rounded-full shadow-lg hover:bg-green-700 transition duration-300 transform hover:scale-105 text-lg flex items-center justify-c
